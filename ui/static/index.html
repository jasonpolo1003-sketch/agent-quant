<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant Brain</title>
<meta name="description" content="Local view of the Quant Agent Brain: what the agents are doing, market data, strategies and a tutor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230e1110%22/%3E%3Cpath d=%22M3 11l3-4 3 2 4-5%22 stroke=%22%23f0a93b%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <div class="brand">Quant Brain</div>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <form class="ask-bar" id="cmd-form" autocomplete="off" role="search">
      <input id="cmd" aria-label="Ask or jump" placeholder="Ask a question, or type SPY">
    </form>
    <div class="live" id="status-live" title="Updates arrive automatically while this is on"><i></i><span>Connecting</span></div>
  </div>
</header>
<main id="page" tabindex="-1"></main>
<footer class="foot"><span id="foot"></span></footer>

<div class="overlay" id="viewer" hidden>
  <div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <b id="viewer-title"></b>
      <span class="grow"></span>
      <button class="btn" id="viewer-learn" type="button">Ask the tutor about this file</button>
      <button class="btn" id="viewer-close" type="button">Close</button>
    </div>
    <pre class="viewer-body" id="viewer-body"></pre>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
