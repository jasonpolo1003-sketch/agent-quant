<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%230b0d0c%22/%3E%3Cpath d=%22M3 11l3-4 3 2 4-5%22 stroke=%22%23ffb238%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">BRAIN<span>TERMINAL</span></div>
  <form class="cmd" id="cmd-form" autocomplete="off">
    <b>&gt;</b>
    <input id="cmd" aria-label="Command" placeholder="SPY · RUN-871299ea31 · SC-0001 · ? what is look-ahead bias · F1–F8">
    <kbd>GO</kbd>
  </form>
  <div class="status" id="status-live" title="Live connection to the brain">
    <i class="dot"></i><span>connecting</span>
  </div>
</header>
<nav class="keys" role="tablist" id="keys"></nav>
<main id="screen" tabindex="-1"></main>
<footer class="bottom">
  <span id="foot-root"></span>
  <span id="foot-git"></span>
  <span id="clock"></span>
</footer>

<div class="overlay" id="viewer" hidden>
  <div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <b id="viewer-title"></b>
      <span class="grow"></span>
      <button class="btn" id="viewer-learn">Ask the tutor about this</button>
      <button class="btn" id="viewer-close" aria-label="Close">Close ✕</button>
    </div>
    <pre class="viewer-body" id="viewer-body"></pre>
  </div>
</div>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
