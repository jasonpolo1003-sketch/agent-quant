<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quant Agent Operations</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--background, #0b0e12);
      --panel: var(--card, #11161d);
      --panel-2: #161c24;
      --ink: var(--foreground, #eef2f6);
      --muted: var(--muted-foreground, #8f9aa7);
      --border-color: var(--border, #29313b);
      --accent-color: var(--accent, #5ee0b8);
      --warn: #f0bb62;
      --danger: #ef7777;
      --idle: #65717f;
      --radius: 10px;
      font-family: "Segoe UI Variable", "Aptos", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    button, select { font: inherit; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      min-height: 58px; display: flex; align-items: center; gap: 14px; padding: 10px 16px;
      border-bottom: 1px solid var(--border-color); background: var(--panel);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-color); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color) 16%, transparent); }
    .brand h1 { margin: 0; font-size: 15px; letter-spacing: .02em; font-weight: 650; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .run-picker { display: flex; align-items: center; gap: 8px; flex: 1; }
    .run-picker label { color: var(--muted); font-size: 12px; }
    select {
      min-height: 34px; max-width: 420px; flex: 1; color: var(--ink); background: var(--panel-2);
      border: 1px solid var(--border-color); border-radius: 7px; padding: 0 10px;
    }
    .actions { display: flex; gap: 7px; }
    .action {
      min-height: 34px; border: 1px solid var(--border-color); border-radius: 7px; padding: 0 11px;
      color: var(--ink); background: transparent; cursor: pointer;
    }
    .action:hover { border-color: var(--muted); background: var(--panel-2); }
    .action.primary { color: #07120e; background: var(--accent-color); border-color: var(--accent-color); font-weight: 650; }
    .layout { min-height: 0; display: grid; grid-template-columns: minmax(330px, .9fr) minmax(390px, 1.2fr) minmax(280px, .8fr); }
    .column { min-width: 0; min-height: 0; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .column:last-child { border-right: 0; }
    .column-head { height: 45px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--border-color); }
    .column-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
    .count { color: var(--muted); font: 12px/1 Consolas, monospace; }
    .lanes, .timeline, .inspector { overflow: auto; min-height: 0; padding: 10px; }
    .lane {
      width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: start;
      padding: 12px 10px; margin-bottom: 6px; text-align: left; color: inherit; background: transparent;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    }
    .lane:hover, .lane.selected { background: var(--panel); border-color: var(--border-color); }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; background: var(--idle); }
    .status-dot.running { background: var(--accent-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 12%, transparent); }
    .status-dot.completed { background: #74b9ff; }
    .status-dot.waiting { background: var(--warn); }
    .status-dot.failed { background: var(--danger); }
    .lane-name, .lane-stage, .lane-message { display: block; }
    .lane-name { font-size: 13px; font-weight: 650; }
    .lane-stage { color: var(--muted); font: 11px/1.4 Consolas, monospace; margin-top: 3px; }
    .lane-message { color: #c3cbd4; font-size: 12px; line-height: 1.35; margin-top: 7px; overflow-wrap: anywhere; }
    .badge { font: 10px/1 Consolas, monospace; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border-color); border-radius: 999px; padding: 4px 6px; }
    .event { position: relative; padding: 2px 4px 14px 28px; }
    .event::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: -6px; width: 1px; background: var(--border-color); }
    .event:last-child::before { display: none; }
    .event-mark { position: absolute; left: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--idle); border: 2px solid var(--bg); }
    .event-mark.running { background: var(--accent-color); }
    .event-mark.completed { background: #74b9ff; }
    .event-mark.failed { background: var(--danger); }
    .event-meta { display: flex; flex-wrap: wrap; gap: 7px; color: var(--muted); font: 10px/1.3 Consolas, monospace; }
    .event-message { margin-top: 5px; font-size: 12px; line-height: 1.45; }
    .event-payload { display: none; margin: 7px 0 0; padding: 8px; max-height: 220px; overflow: auto; background: var(--panel); border: 1px solid var(--border-color); border-radius: 6px; color: #b8c3cf; font: 10px/1.45 Consolas, monospace; white-space: pre-wrap; }
    .event.open .event-payload { display: block; }
    .inspector section { padding: 11px; margin-bottom: 8px; background: var(--panel); border: 1px solid var(--border-color); border-radius: var(--radius); }
    .inspector h3 { margin: 0 0 9px; font-size: 12px; }
    .kv { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 6px 8px; margin-bottom: 6px; font-size: 11px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .empty { color: var(--muted); font-size: 12px; padding: 18px 10px; line-height: 1.5; }
    .toast { position: fixed; right: 14px; bottom: 14px; padding: 9px 12px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--border-color); border-radius: 7px; font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1000px) { .layout { grid-template-columns: 1fr 1.2fr; } .column.inspector-col { display: none; } }
    @media (max-width: 720px) { .topbar { align-items: flex-start; flex-wrap: wrap; } .brand { min-width: 100%; } .layout { grid-template-columns: 1fr; } .column { border-right: 0; border-bottom: 1px solid var(--border-color); min-height: 45vh; } .actions { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="pulse"></span><div><h1>Quant Agent Operations</h1><small id="connection">connecting to local event stream</small></div></div>
    <div class="run-picker"><label for="runSelect">RUN</label><select id="runSelect"><option>Loading…</option></select></div>
    <div class="actions">
      <button class="action" id="inspectBtn">Inspect agent</button>
      <button class="action primary" id="continueBtn">Continue run</button>
    </div>
  </header>
  <main class="layout">
    <section class="column">
      <div class="column-head"><h2>Agent lanes</h2><span class="count" id="agentCount">0</span></div>
      <div class="lanes" id="lanes"></div>
    </section>
    <section class="column">
      <div class="column-head"><h2>Live event trail</h2><span class="count" id="eventCount">0</span></div>
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="column inspector-col">
      <div class="column-head"><h2>Inspector</h2><span class="count" id="refreshTime">—</span></div>
      <div class="inspector" id="inspector"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
  const API = location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
  const orderedRoles = ['orchestrator','research_scout','qwen3:14b','qwen3.8:27b','knowledge_curator','strategy_generator','backtest_agent','risk_reviewer'];
  let selectedRun = localStorage.getItem('qab-run') || '';
  let selectedAgent = localStorage.getItem('qab-agent') || 'research_scout';
  let currentData = null;
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function toast(message){ const el=$('toast'); el.textContent=message; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
  function hermesSend(prompt){ if(window.hermes?.send){ window.hermes.send(prompt); } else { toast('Open this dashboard inside Hermes to send an instruction.'); } }
  async function json(url){ const response=await fetch(API+url,{cache:'no-store'}); if(!response.ok) throw new Error(await response.text()); return response.json(); }
  async function loadRuns(){
    const runs=await json('/api/runs?limit=30');
    if(!runs.length){ $('runSelect').innerHTML='<option>No runs yet</option>'; return; }
    if(!selectedRun || !runs.some(r=>r.run_id===selectedRun)) selectedRun=runs[0].run_id;
    $('runSelect').innerHTML=runs.map(r=>`<option value="${esc(r.run_id)}" ${r.run_id===selectedRun?'selected':''}>${esc(r.run_id)} · ${esc(r.task_id||'ad hoc')} · ${esc(r.status)}</option>`).join('');
    localStorage.setItem('qab-run',selectedRun);
  }
  function renderLanes(data){
    const agents=data.state.agents||{};
    const roles=[...orderedRoles,...Object.keys(agents).filter(r=>!orderedRoles.includes(r))];
    $('agentCount').textContent=Object.keys(agents).length+' active';
    $('lanes').innerHTML=roles.map(role=>{
      const a=agents[role]||{status:'idle',stage:'not started',message:'No event in this run'};
      const selected=role===selectedAgent?' selected':'';
      return `<button class="lane${selected}" data-role="${esc(role)}"><span class="status-dot ${esc(a.status)}"></span><span><span class="lane-name">${esc(role)}</span><span class="lane-stage">${esc(a.stage)} · event ${esc(a.event_id||'—')}</span><span class="lane-message">${esc(a.message||'No message')}</span></span><span class="badge">${esc(a.status)}</span></button>`;
    }).join('');
    document.querySelectorAll('.lane').forEach(el=>el.onclick=()=>{ selectedAgent=el.dataset.role; localStorage.setItem('qab-agent',selectedAgent); renderLanes(currentData); renderInspector(currentData); });
  }
  function renderTimeline(data){
    const events=[...(data.events||[])].reverse();
    $('eventCount').textContent=events.length+' events';
    $('timeline').innerHTML=events.length?events.map(e=>`<article class="event" data-event="${e.event_id}"><span class="event-mark ${esc(e.status)}"></span><div class="event-meta"><span>#${e.event_id}</span><span>${esc(e.agent_role)}</span><span>${esc(e.stage)}</span><span>${esc(e.event_type)}</span><span>${esc(e.created_at)}</span></div><div class="event-message">${esc(e.message||'')}</div>${Object.keys(e.payload||{}).length?`<pre class="event-payload">${esc(JSON.stringify(e.payload,null,2))}</pre>`:''}</article>`).join(''):'<div class="empty">No events recorded for this run.</div>';
    document.querySelectorAll('.event').forEach(el=>el.onclick=()=>el.classList.toggle('open'));
  }
  function renderInspector(data){
    const task=data.task||{}; const agent=(data.state.agents||{})[selectedAgent]||{};
    const relevant=(data.events||[]).filter(e=>e.agent_role===selectedAgent).slice(-6).reverse();
    $('inspector').innerHTML=`<section><h3>Task</h3><dl class="kv"><dt>Research ID</dt><dd>${esc(task.research_id||data.state.task_id||'—')}</dd><dt>Status</dt><dd>${esc(task.status||'—')}</dd><dt>Question</dt><dd>${esc(task.question||'—')}</dd></dl></section><section><h3>${esc(selectedAgent)}</h3><dl class="kv"><dt>Status</dt><dd>${esc(agent.status||'idle')}</dd><dt>Stage</dt><dd>${esc(agent.stage||'not started')}</dd><dt>Latest</dt><dd>${esc(agent.message||'No events')}</dd></dl></section><section><h3>Recent handoffs</h3>${relevant.length?relevant.map(e=>`<div class="event-message">#${e.event_id} · ${esc(e.event_type)}<br><span style="color:var(--muted)">${esc(e.message||'')}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--border-color)">'):'<div class="empty">No handoffs for this agent.</div>'}</section>`;
  }
  async function refresh(){
    try{
      await loadRuns(); if(!selectedRun) return;
      currentData=await json('/api/run?run_id='+encodeURIComponent(selectedRun));
      renderLanes(currentData); renderTimeline(currentData); renderInspector(currentData);
      $('connection').textContent='live · polling SQLite every second'; $('refreshTime').textContent=new Date().toLocaleTimeString();
    }catch(error){ $('connection').textContent='offline · '+error.message; }
  }
  $('runSelect').onchange=e=>{selectedRun=e.target.value;localStorage.setItem('qab-run',selectedRun);refresh();};
  $('inspectBtn').onclick=()=>hermesSend(`Inspect agent ${selectedAgent} in quant-agent-brain run ${selectedRun}. Explain its latest event, evidence, blockers, and next safe action.`);
  $('continueBtn').onclick=()=>hermesSend(`Continue quant-agent-brain run ${selectedRun} from its latest verified event. Preserve the quality gates and report new events to the dashboard.`);
  refresh(); setInterval(refresh,1000);
</script>
</body>
</html>
