name: CI

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check src tests scripts
